name: Build yuhaiin APK (Simple)

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: 'Target IP'
        required: false
        default: '104.19.229.21'
      fake_sni:
        description: 'Fake SNI'
        required: false
        default: 'www.hcaptcha.com'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install NDK via sdkmanager with Java 11
      run: |
        # Use Java 11 for sdkmanager
        export JAVA_HOME=$JAVA_HOME_11_X64
        echo "y" | ${ANDROID_HOME}/tools/bin/sdkmanager --install "ndk;25.1.8937393"
        
    - name: Create config
      run: |
        mkdir -p app/src/main/assets
        cat > app/src/main/assets/sni_config.json << EOF
        {
          "enabled": true,
          "target_ip": "${{ github.event.inputs.target_ip }}",
          "target_port": 443,
          "fake_sni": "${{ github.event.inputs.fake_sni }}"
        }
        EOF
        
    - name: Build
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yuhaiin-sni-spoof
        path: app/build/outputs/apk/release/*.apk
