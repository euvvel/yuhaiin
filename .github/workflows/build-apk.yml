name: Build yuhaiin APK with SNI Spoof

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: 'Target IP for SNI spoof'
        required: false
        default: '104.19.229.21'
      fake_sni:
        description: 'Fake SNI domain'
        required: false
        default: 'www.hcaptcha.com'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Setup Java 17 (Required for Android SDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # Skip JDK version check since we already have Java 17
        skip-jdk-check: true
        
    - name: Install NDK
      run: |
        # Download NDK directly - most reliable method
        cd $ANDROID_HOME
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/android-ndk-r25c" >> $GITHUB_ENV
        
    - name: Create custom config
      run: |
        mkdir -p app/src/main/assets
        cat > app/src/main/assets/sni_config.json << EOF
        {
          "enabled": true,
          "target_ip": "${{ github.event.inputs.target_ip }}",
          "target_port": 443,
          "fake_sni": "${{ github.event.inputs.fake_sni }}"
        }
        EOF
        echo "✅ Config created:"
        cat app/src/main/assets/sni_config.json
        
    - name: Setup gradle permissions
      run: chmod +x gradlew
      
    - name: Build Android APK
      run: |
        export ANDROID_NDK_HOME=$ANDROID_HOME/android-ndk-r25c
        ./gradlew assembleRelease --no-daemon
        
    - name: Find and upload APK
      run: |
        echo "Looking for APK files..."
        find app/build -name "*.apk" -type f
        # Copy APK to a known location
        mkdir -p artifacts
        find app/build -name "*.apk" -type f -exec cp {} artifacts/ \;
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yuhaiin-sni-spoof
        path: artifacts/*.apk
