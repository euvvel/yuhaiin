name: Build yuhaiin APK with SNI Spoof

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: 'Target IP for SNI spoof'
        required: false
        default: '104.19.229.21'
      fake_sni:
        description: 'Fake SNI domain'
        required: false
        default: 'www.hcaptcha.com'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'  # Changed from 17 to 11 for compatibility
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install Android NDK (alternative method)
      run: |
        # Download NDK directly instead of using sdkmanager
        cd /tmp
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        sudo mv android-ndk-r25c /usr/local/android-ndk
        echo "ANDROID_NDK_HOME=/usr/local/android-ndk" >> $GITHUB_ENV
        echo "PATH=/usr/local/android-ndk:$PATH" >> $GITHUB_ENV
        
    - name: Create custom config
      run: |
        mkdir -p app/src/main/assets
        cat > app/src/main/assets/sni_config.json << EOF
        {
          "enabled": true,
          "target_ip": "${{ github.event.inputs.target_ip }}",
          "target_port": 443,
          "fake_sni": "${{ github.event.inputs.fake_sni }}"
        }
        EOF
        echo "Config created:"
        cat app/src/main/assets/sni_config.json
        
    - name: Setup gradle permissions
      run: chmod +x gradlew
      
    - name: Build Android APK
      run: |
        # Set NDK path for gradle
        export ANDROID_NDK_HOME=/usr/local/android-ndk
        ./gradlew assembleRelease --no-daemon
        
    - name: List build outputs
      run: |
        echo "Checking for APK files..."
        find . -name "*.apk" -type f
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yuhaiin-sni-spoof
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/*/*.apk
