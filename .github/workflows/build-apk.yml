name: Build yuhaiin Android APK

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: 'Target IP for SNI spoof'
        required: false
        default: '104.19.229.21'
      fake_sni:
        description: 'Fake SNI domain'
        required: false
        default: 'www.hcaptcha.com'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        skip-jdk-check: true
        
    - name: Install NDK
      run: |
        echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"
        
    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        ~/go/bin/gomobile init
        
    - name: Set environment variables
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
        echo "PATH=$PATH:~/go/bin" >> $GITHUB_ENV
        
    - name: Update config with workflow inputs
      run: |
        # Update the config file with workflow inputs
        cat > app/src/main/assets/sni_config.json << EOF
        {
          "enabled": true,
          "target_ip": "${{ github.event.inputs.target_ip }}",
          "target_port": 443,
          "fake_sni": "${{ github.event.inputs.fake_sni }}"
        }
        EOF
        echo "Config updated:"
        cat app/src/main/assets/sni_config.json
        
    - name: Build Android APK
      run: |
        # Use make to build Android APK (not gradlew)
        make android
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yuhaiin-sni-spoof
        path: |
          build/*.apk
          *.apk
